<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Serverless AI Factory — autonomous dev pipeline architecture">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#FF9900"/>
    </marker>
    <style>
      .box { fill: #1e293b; stroke: #475569; stroke-width: 2; rx: 8; }
      .label { fill: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .sublabel { fill: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; }
      .arrow { stroke: #FF9900; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .title { fill: #FF9900; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
    </style>
  </defs>

  <text x="480" y="28" text-anchor="middle" class="title">AUTONOMOUS DEV PIPELINE · SCALE-TO-ZERO AWS</text>

  <rect x="30" y="120" width="130" height="64" class="box"/>
  <text x="85" y="148" text-anchor="middle" class="label">GitHub</text>
  <text x="85" y="166" text-anchor="middle" class="sublabel">issue webhook</text>

  <rect x="210" y="120" width="130" height="64" class="box"/>
  <text x="275" y="148" text-anchor="middle" class="label">API Gateway</text>
  <text x="275" y="166" text-anchor="middle" class="sublabel">ingress</text>

  <rect x="390" y="120" width="130" height="64" class="box"/>
  <text x="445" y="148" text-anchor="middle" class="label">EventBridge</text>
  <text x="445" y="166" text-anchor="middle" class="sublabel">orchestration</text>

  <rect x="560" y="56" width="130" height="52" class="box"/>
  <text x="625" y="82" text-anchor="middle" class="label">Lambda</text>
  <text x="625" y="98" text-anchor="middle" class="sublabel">plan agent</text>

  <rect x="560" y="120" width="130" height="52" class="box"/>
  <text x="625" y="146" text-anchor="middle" class="label">Lambda</text>
  <text x="625" y="162" text-anchor="middle" class="sublabel">code agent</text>

  <rect x="560" y="196" width="130" height="52" class="box"/>
  <text x="625" y="220" text-anchor="middle" class="label">Step Functions</text>
  <text x="625" y="236" text-anchor="middle" class="sublabel">&gt;15 min workflows</text>

  <rect x="760" y="72" width="130" height="52" class="box"/>
  <text x="835" y="100" text-anchor="middle" class="label">DynamoDB</text>
  <text x="835" y="116" text-anchor="middle" class="sublabel">run state</text>

  <rect x="760" y="148" width="130" height="52" class="box"/>
  <text x="835" y="174" text-anchor="middle" class="label">Vector store</text>
  <text x="835" y="190" text-anchor="middle" class="sublabel">agent memory</text>

  <rect x="760" y="224" width="130" height="52" class="box"/>
  <text x="835" y="250" text-anchor="middle" class="label">GitHub PR</text>
  <text x="835" y="266" text-anchor="middle" class="sublabel">output</text>

  <path d="M160 152 L210 152" class="arrow"/>
  <path d="M340 152 L390 152" class="arrow"/>
  <path d="M520 140 L560 82" class="arrow"/>
  <path d="M520 152 L560 146" class="arrow"/>
  <path d="M520 164 L560 220" class="arrow"/>
  <path d="M690 82 L760 96" class="arrow"/>
  <path d="M690 146 L760 174" class="arrow"/>
  <path d="M690 220 L760 250" class="arrow"/>

  <text x="480" y="340" text-anchor="middle" class="sublabel">Agents spin up on demand · scale to zero when idle</text>
</svg>
