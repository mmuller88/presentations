<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Standard AWS vs AWS European Sovereign Cloud">
  <defs>
    <linearGradient id="aws" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232f3e"/>
      <stop offset="100%" stop-color="#131a22"/>
    </linearGradient>
    <linearGradient id="esc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" fill="#0f172a"/>
  <text x="480" y="36" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">Two partitions  not just another EU region</text>
  <rect x="40" y="70" width="420" height="300" rx="16" fill="url(#aws)" stroke="#475569" stroke-width="2"/>
  <text x="250" y="110" fill="#FF9900" font-family="system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Standard AWS</text>
  <text x="250" y="140" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Partition: aws</text>
  <text x="250" y="175" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">eu-central-1 (Frankfurt)</text>
  <text x="250" y="210" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">EU data residency</text>
  <text x="250" y="240" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Global AWS operations</text>
  <text x="250" y="270" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Full service catalog</text>
  <text x="250" y="330" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Most workloads</text>
  <rect x="500" y="70" width="420" height="300" rx="16" fill="url(#esc)" stroke="#FF9900" stroke-width="2"/>
  <text x="710" y="110" fill="#FF9900" font-family="system-ui,sans-serif" font-size="22" font-weight="700" text-anchor="middle">AWS ESC</text>
  <text x="710" y="140" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">Partition: aws-eusc</text>
  <text x="710" y="175" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">eusc-de-east-1 (Brandenburg)</text>
  <text x="710" y="210" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Physically isolated EU infra</text>
  <text x="710" y="240" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">EU-resident operations</text>
  <text x="710" y="270" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">~90 services at GA</text>
  <text x="710" y="330" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Sovereignty-critical workloads</text>
  <path d="M460 220 h40" stroke="#FF9900" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FF9900"/>
    </marker>
  </defs>
</svg>
